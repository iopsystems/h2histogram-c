name: C checks
on: [push, pull_request]
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-format.txt
      - run: clang-format --dry-run --Werror include/*.h src/*.c tests/*.c examples/*.c verify/*.c
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        compiler: [gcc, clang]
        mode: [Debug, Release]
        sanitizer: ['OFF', 'ON']
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build -DCMAKE_C_COMPILER=${{ matrix.compiler }} -DCMAKE_BUILD_TYPE=${{ matrix.mode }} -DH2_SANITIZE=${{ matrix.sanitizer }}
      - run: cmake --build build --parallel
      - run: ctest --test-dir build --output-on-failure
      - run: ./build/h2_example
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install CBMC 6.6.0
        run: |
          curl -sSLo cbmc.deb https://github.com/diffblue/cbmc/releases/download/cbmc-6.6.0/ubuntu-24.04-cbmc-6.6.0-Linux.deb
          sudo apt-get install -y ./cbmc.deb
          cbmc --version
      - run: verify/run.sh
